<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09132c"/>
      <stop offset="50%" stop-color="#172b68"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <!-- Subtle Inner Border -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="8"/>
  <!-- Crown / Premium Gold Star Badge -->
  <circle cx="396" cy="120" r="22" fill="url(#goldGrad)" filter="url(#glow)"/>
  <!-- AHL Monogram -->
  <text x="256" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="190" fill="#ffffff" text-anchor="middle" letter-spacing="-6">AHL</text>
  <!-- Gold Accent Underline -->
  <rect x="156" y="365" width="200" height="10" rx="5" fill="url(#goldGrad)"/>
</svg>